# Which sections to watch.
#
# Run `python -m tracker.run probe` once to see the exact district and section
# names KSEB uses, then paste them in. Names are matched case- and
# punctuation-insensitively, so "Thalassery" and "THALASSERY" both work.
#
# Use sections: "*" to take every section in a district. Start narrow --
# a full district is a few hundred transformers and a slow, impolite scrape.

targets:
  - district: KANNUR
    sections: "*"

  # - district: KASARAGOD
  #   sections:
  #     - KANHANGAD
  #     - NILESHWAR

dashboard_url: https://mshinoof.github.io/cygnusenergy/dtr/

options:
  headless: true          # false to watch the browser work, useful when debugging
  delay_seconds: 3        # pause between sections; be a good guest on a public site
  settle_ms: 2500         # how long to wait for the JSF AJAX to fill the table
  min_kw: 0.5             # ignore movements smaller than this (rounding noise)
  watch_balance: true     # false = only alert on new/upgraded transformers
  min_row_ratio: 0.6      # abort if a run returns under 60% of last run's rows
