# Which sections to watch.
#
# District names must match KSEB's spellings exactly as listed below (note
# ALAPUZHA and KASARGODE -- those are KSEB's spellings, not typos).
#
# sections: "*"  takes every section in the district, resolved automatically
#                at run time. No need to list them.
# sections: [Thalassery, Panoor]   watches only those.
#
# Section names are matched case- and punctuation-insensitively. Run the
# workflow in `probe` mode to see the full list for any district.

targets:
  - district: KANNUR
    sections: "*"

  # Uncomment to widen. Each district adds roughly a minute to the run.
  # - district: KASARGODE
  #   sections: "*"
  # - district: KOZHIKODE
  #   sections: [Vadakara, Nadapuram]

# Full district list KSEB publishes:
#   ALAPUZHA  ERNAKULAM  IDUKKI  KANNUR  KASARGODE  KOLLAM  KOTTAYAM
#   KOZHIKODE  MALAPPURAM  PALAKKAD  PATHANAMTHITTA  THIRUVANANTHAPURAM
#   THRISSUR  WAYANAD

dashboard_url: https://mshinoof.github.io/cygnus-dtr-watch/dashboard.html

options:
  delay_seconds: 1.5      # pause between section requests; be a good guest
  min_kw: 0.5             # ignore movements smaller than this (rounding noise)
  watch_balance: true     # false = only alert on new/upgraded transformers
  min_row_ratio: 0.6      # abort if a run returns under 60% of last run's rows
